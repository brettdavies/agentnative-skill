# Dependabot configuration.
#
# One ecosystem: github-actions. The bundle is markdown plus shell and carries
# no package manifest, so workflow actions are the only dependencies here.
#
# `target-branch: dev` on the version-update block keeps Dependabot PRs on the
# dev -> release/* -> main flow that guard-release-branch.yml enforces.
# Retargeting after the fact orphans-and-closes the PR irreversibly, so the
# target is set from the start.
#
# Security updates are raised against the default branch and ignore every
# option on a block that carries `target-branch`, so the trailing block has no
# target-branch, `open-pull-requests-limit: 0` so it never opens version
# updates there, and a group with `applies-to: security-updates` that batches
# minor and patch fixes per run. A fix that needs a major stays its own PR.
# Cooldown and the majors ignore are absent from it on purpose: cooldown is a
# version-update option, and the ignore would suppress a fix that resolves
# outside the current range. scripts/release/drift.sh lists any such fix dev
# has not yet received before a release is cut.
#
# The version-update group uses `patterns` rather than `update-types` because
# a SHA pin's SemVer level comes from a trailing comment and an unclassifiable
# action would otherwise fall out of the group and open alone.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    reviewers:
      - brettdavies
    labels:
      - dependencies
      - github-actions
    groups:
      actions-minor-patch:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - security
    groups:
      actions-security-minor-patch:
        applies-to: security-updates
        update-types:
          - minor
          - patch
