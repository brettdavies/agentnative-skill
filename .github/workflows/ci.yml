name: CI

on:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

env:
  # Force JavaScript actions to run on Node 24 (per brettdavies repo policy)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            #node_modules

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run ShellCheck (producer scripts)
        # The bundle is markdown-only (spec, references, templates, getting-started).
        # Only producer-ops scripts under ./scripts/ are subject to shellcheck.
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        env:
          # style severity surfaces all suggestions; CI fails on error+warning by default
          SHELLCHECK_OPTS: "--severity=style"
        with:
          scandir: ./scripts
